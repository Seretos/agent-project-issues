name: dispatch-to-marketplace

# Manual recovery tool. The normal release flow (release.yml) dispatches to
# the marketplace itself. Use this only when:
#   - The marketplace dispatch step in release.yml failed and you want to
#     retry without re-running the whole build.
#   - You need to re-publish an existing release to the marketplace (e.g.
#     after the marketplace.json schema changed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dispatch (e.g. agent-project-issues--v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          # New tag format: <plugin-name>--v<version>
          VERSION="${TAG##*--v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      # #298: marketplace-payload.sh lives on `main`, not on the ancestor-
      # less `release` branch (which carries no `.github/` at all) -- so a
      # second, sparse checkout pulls just that one script from `main`
      # alongside the `release` checkout above. dispatch.yml's own VERSION
      # (below) is already proven valid semver by construction -- it's only
      # ever accepted once it matches plugin.json's version on the `release`
      # branch, and release.yml's `stamp` job never stamps a non-semver
      # value into that manifest -- so this workflow does not duplicate the
      # semver grammar the way release.yml and prev-release-tag.sh do.
      - name: Checkout scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Verify plugin.json version matches tag
        shell: bash
        run: |
          PJ_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json on release branch is v$PJ_VERSION, but you asked to dispatch v$TAG_VERSION."
            echo "Re-run release.yml with version=$TAG_VERSION (or re-check the release branch state)."
            exit 1
          fi

      - name: Read plugin metadata from plugin.json
        id: meta
        shell: bash
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"        >> "$GITHUB_OUTPUT"

      - name: Dispatch to agent-marketplace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          NAME:     ${{ steps.meta.outputs.name }}
          DESC:     ${{ steps.meta.outputs.description }}
          VERSION:  ${{ steps.tag.outputs.version }}
          TAG:      ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url ) || RELEASE_JSON=""
          if [ -z "$RELEASE_JSON" ]; then
            echo "::warning::failed to read published release body; changelog will be omitted from marketplace dispatch payload"
          fi
          BODY=$(jq -r '.body' <<<"$RELEASE_JSON" && printf x); BODY="${BODY%x}"
          BODY="${BODY%$'\n'}"
          URL=$(jq -r '.url // ""' <<<"$RELEASE_JSON")

          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="$GITHUB_REPOSITORY" VERSION="$VERSION" TAG="$TAG" CHANGELOG_RAW="$BODY" RELEASE_URL="$URL" bash ".ci-main/.github/scripts/marketplace-payload.sh")

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            -d @- <<<"$PAYLOAD"
